name: Optimize hero videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/videos/*.mp4"
      - ".github/workflows/optimize-videos.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Optimize MP4 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .video-optimized

          for input in assets/videos/*.mp4; do
            filename="$(basename "$input")"
            output=".video-optimized/$filename"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$input" \
              -map_metadata -1 \
              -an \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2" \
              -c:v libx264 \
              -preset slow \
              -crf 28 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$output"

            original_size="$(stat -c%s "$input")"
            optimized_size="$(stat -c%s "$output")"

            if [ "$optimized_size" -lt "$original_size" ]; then
              mv "$output" "$input"
              echo "$filename: $original_size -> $optimized_size bytes"
            else
              rm "$output"
              echo "$filename: original already smaller; unchanged"
            fi
          done

          rmdir .video-optimized

      - name: Commit optimized videos
        shell: bash
        run: |
          if git diff --quiet -- assets/videos; then
            echo "No video changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos
          git commit -m "Optimize hero videos [skip ci]"
          git push
