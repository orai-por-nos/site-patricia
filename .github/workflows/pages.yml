name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  visual-check:
    name: Visual validation
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the published URL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --output /dev/null "https://orai-por-nos.github.io/site-patricia/"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile
        shell: bash
        run: |
          mkdir -p visual-audit
          npx playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page "https://orai-por-nos.github.io/site-patricia/" visual-audit/desktop.png
          npx playwright screenshot --browser chromium --viewport-size "390,844" --full-page "https://orai-por-nos.github.io/site-patricia/" visual-audit/mobile.png

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: visual-audit
          if-no-files-found: error

      - name: Publish captures for review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f visual-audit/desktop.png visual-audit/mobile.png
          git commit -m "Add visual audit captures [skip ci]"
          git push
